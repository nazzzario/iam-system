services:

  postgres:
    image: postgres:16-alpine
    container_name: iam-postgres
    environment:
      POSTGRES_DB: userdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-network

  keycloak-postgres:
    image: postgres:16-alpine
    container_name: iam-keycloak-postgres
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
    ports:
      - "5433:5432"
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - iam-network

  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    container_name: iam-keycloak
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_IMPORT: /opt/keycloak/data/import/realm-export.json
    ports:
      - "8080:8080"
    depends_on:
      keycloak-postgres:
        condition: service_healthy
    volumes:
      - ./keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json:ro
    networks:
      - iam-network

  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    container_name: iam-user-service
    env_file:
      - .env
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: userdb
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/iam-realm
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/iam-realm/protocol/openid-connect/certs
      KEYCLOAK_SERVER_URL: http://keycloak:8080
      KEYCLOAK_REALM: iam-realm
      KEYCLOAK_CLIENT_ID: iam-client
      KEYCLOAK_CLIENT_SECRET: ${KEYCLOAK_CLIENT_SECRET}
    ports:
      - "8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - iam-network

  api-gateway:
    build:
      context: ./api-gateway
      dockerfile: Dockerfile
    container_name: iam-api-gateway
    environment:
      SERVER_PORT: 8888
      USER_SERVICE_URL: http://user-service:8081
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/iam-realm
      KEYCLOAK_JWK_URI: http://keycloak:8080/realms/iam-realm/protocol/openid-connect/certs
    ports:
      - "8888:8888"
    depends_on:
      user-service:
        condition: service_started
      keycloak:
        condition: service_started
    networks:
      - iam-network

networks:
  iam-network:
    driver: bridge

volumes:
  postgres_data:
  keycloak_postgres_data:
