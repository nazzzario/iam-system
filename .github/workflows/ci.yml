name: CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: 21
          distribution: temurin
          cache: maven

      - name: Build and test user-service
        working-directory: user-service
        run: ./mvnw clean verify

      - name: Build and test api-gateway
        working-directory: api-gateway
        run: ./mvnw clean verify

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: |
            user-service/target/surefire-reports/
            api-gateway/target/surefire-reports/
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build user-service Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./user-service
          push: false
          tags: iam-user-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build api-gateway Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./api-gateway
          push: false
          tags: iam-api-gateway:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
